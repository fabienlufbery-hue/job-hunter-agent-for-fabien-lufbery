name: CI — Quality, Tests & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit & Integration Tests
        run: npm test

      - name: Secret leak scan
        run: npm run check:secrets

      - name: Production Next.js build
        run: npm run build

      - name: Verify the public demo on desktop and mobile
        shell: bash
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.58.2
          AUTH_SECRET="$(openssl rand -hex 32)" npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/job-hunter-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            curl --fail --silent http://127.0.0.1:3000/login > /dev/null && break
            sleep 1
          done
          mkdir -p browser-evidence
          node scripts/browser-smoke.mjs | tee browser-evidence/checks.txt

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-browser-evidence
          path: browser-evidence/
          if-no-files-found: error
