name: Daily Job Sync (09:00 & 18:00 Europe/Paris)

on:
  # Runs at UTC hours covering 09:00 and 18:00 Europe/Paris in both winter (UTC+1) and summer (UTC+2).
  # The Europe/Paris guard below ensures execution happens strictly at 09:00 and 18:00 local Paris time.
  schedule:
    - cron: '0 7,8,16,17 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync outside 09:00 / 18:00 Europe/Paris window'
        required: false
        default: 'true'

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check Europe/Paris DST time window
        id: tz_guard
        run: |
          PARIS_HOUR=$(TZ="Europe/Paris" date +%H)
          echo "Current Europe/Paris hour: ${PARIS_HOUR}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "force_flag=true" >> "$GITHUB_OUTPUT"
          elif [ "$PARIS_HOUR" = "09" ] || [ "$PARIS_HOUR" = "18" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "force_flag=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping off-slot UTC trigger (DST guard)."
          fi

      - name: Trigger Job Hunter Agent Server Sync
        if: steps.tz_guard.outputs.should_run == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL or CRON_SECRET GitHub Actions secrets are not configured yet."
            exit 0
          fi
          TARGET="${APP_URL%/}/api/cron/sync?force=${{ steps.tz_guard.outputs.force_flag }}"
          echo "Calling ${TARGET}"
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" -X POST "$TARGET" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          cat response.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Cron sync failed with HTTP $HTTP_CODE"
            exit 1
          fi
